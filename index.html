<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
  <meta charset="UTF-8" />
  <meta name="description" content="Testing my calculator">

  <link rel="stylesheet" href="./style.css">

  <script defer src="./script.js"></script>
</head>
<body>
<header>
    <h1>Welcome to my digital calculator</h1>
</header>

<section class="calculator_body">
    <div id="screen">
        <p id="screen_text">0</p>
    </div>
    <div class="numbers_operators">
    <div class="numbers">

        <button class="btn_number">7</button>
        <button class="btn_number">8</button>
        <button class="btn_number">9</button>
        <button class="btn_number">4</button>
        <button class="btn_number">5</button>
        <button class="btn_number">6</button>
        <button class="btn_number">1</button>
        <button class="btn_number">2</button>
        <button class="btn_number">3</button>
        <button id="C">C</button>
        <button class="btn_number">0</button>
        <button id="point">.</button>
    </div>
    <div class="operators">
        <button>÷</button>
        <button>⌫</button>
        <button>X</button>
        <button>%</button>
        <button>+</button>
        <button id="equal_btn">=</button>
        <button>-</button>
    </div>
    </div>
</section>
</body>
