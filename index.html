<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator</title>
  <meta charset="UTF-8" />
  <meta name="description" content="Testing my calculator">

  <link rel="stylesheet" href="./style.css">

  <script defer src="./script.js"></script>
</head>
<body>
<header>
    <h1>Welcome to my digital calculator</h1>
</header>

<section class="calculator-body">
    <div id="screen">
        <p class="screen-text" id="screen-top">0</p>
        <p class="screen-text" id="screen-bottom">0</p>
    </div>
    <div class="numbers-operators">
    <div class="numbers">

        <button class="btn-number">7</button>
        <button class="btn-number">8</button>
        <button class="btn-number">9</button>
        <button class="btn-number">4</button>
        <button class="btn-number">5</button>
        <button class="btn-number">6</button>
        <button class="btn-number">1</button>
        <button class="btn-number">2</button>
        <button class="btn-number">3</button>
        <button id="C">C</button>
        <button class="btn-number">0</button>
        <button id="point" data-point="."><svg viewBox="0 0 24 24" width="8px" fill="currentColor">
  <circle cx="12" cy="12" r="5" />
</svg>
        </button>
    </div>
    <div class="operators">
        
        <button class="operator" id="divide" data-operator="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <circle cx="12" cy="6" r="1" fill="currentColor" />
  <circle cx="12" cy="18" r="1" fill="currentColor" />
  <path d="M5 12h14" />
</svg></button>

        <button id="backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M19 12H5M10 7l-5 5 5 5" />
</svg></button>

        <button class="operator" id="multiply" data-operator="*"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M6 6l12 12M6 18L18 6" />
  </svg></button>

        <button class="operator" id="percentage" data-operator="%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <circle cx="7" cy="7" r="1" />
  <circle cx="17" cy="17" r="1" />
  <path d="M6 18l12-12" />
</svg></button>

        <button class="operator" id="addition" data-operator="+"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M12 5v14M5 12h14" />
</svg></button>

        <button id="equal-btn" data-operator="="><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M5 8h14M5 15h14" />
</svg></button>

        <button class="operator" id="subtract" data-operator="-"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <path d="M5 12l14 0" />
</svg></button>

    </div>
    </div>
</section>
</body>
